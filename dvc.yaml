# dvc.yaml — le pipeline reproductible du TP (dvc repro)
stages:
  preparer:
    cmd: python src/preparer.py
    deps: [src/preparer.py]
    outs: [data/vins.csv]          # désormais produit (et versionné) par cette étape
  valider:
    cmd: python src/valider.py data/vins.csv
    deps: [src/valider.py, data/vins.csv]
  entrainer:
    cmd: python src/entrainer.py
    deps: [src/entrainer.py, data/vins.csv]
    params: [entrainement]         # section de params.yaml
    outs: [modeles/modele_final.pkl]
    metrics:
      - metriques.json:
          cache: false             # petit fichier lisible, versionné par Git
